pipeline:
  name: harnessDeveloperHub
  identifier: harnessDeveloperHub
  projectIdentifier: Harness_Commons
  orgIdentifier: PROD
  description: This is for HDH checks and build previews pipeline
  tags:
    TicketID: HDH-386
    BT-14506: ""
    Owner: HDH
  stages:
    - stage:
        name: Build
        identifier: build
        description: This is for HDH checks and build previews pipeline
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: xlarge
          execution:
            steps:
              - parallel:
                  - step:
                      type: Run
                      name: ESLint Check
                      identifier: ESLint_Check
                      spec:
                        shell: Bash
                        command: |-
                          # Install fnm
                          curl -o- https://fnm.vercel.app/install | bash

                          # Load fnm into current shell (so we don’t have to reopen terminal)
                          export FNM_PATH="$HOME/.local/share/fnm"
                          if [ -d "$FNM_PATH" ]; then
                            export PATH="$FNM_PATH:$PATH"
                            eval "`$FNM_PATH/fnm env`"
                          fi

                          # Install and use Node.js 22
                          fnm install 22
                          fnm use 22

                          echo "Verify node version:"
                          node -v

                          echo "Verify npm version:"
                          npm -v

                          echo "Installing dependencies..."
                          yarn

                          echo "Running ESLint..."
                          yarn run lint:ci
                  - step:
                      type: Run
                      name: kebab-case Check
                      identifier: kebabcase_Check
                      spec:
                        shell: Sh
                        command: |-
                          # Define color codes for output
                           Red='\033[0;31m'
                                                Green='\033[0;32m'
                                                Yellow='\033[0;33m'
                                                Blue='\033[0;34m'
                                                Reset='\033[0m'

                                                echo -e "${Blue}Checking all changed Markdown and image files...${Reset}"

                                                failure_flag=0

                                                # Get changed files (Harness clones PR ref by default, so use FETCH_HEAD for PR builds)
                                                changed_files=$(git diff --name-only --diff-filter=d HEAD^1 HEAD | grep -E '\.(md|jpg|png|jpeg|svg)$' | grep -E '^(docs|kb|community|roadmap|static|university|release-notes)/' || true)

                                                if [ -z "$changed_files" ]; then
                                                  echo -e "${Green}No relevant files were changed in this PR.${Reset}"
                                                  exit 0
                                                fi

                                                echo -e "${Blue}Changed files:${Reset}"
                                                x=1
                                                echo "$changed_files" | while read -r file; do
                                                  echo -e "${Yellow}$x. $file${Reset}"
                                                  x=$((x + 1))
                                                done

                                                # Kebab-case validation
                                                invalid_kebab_case=$(echo "$changed_files" | grep -vE '^([a-z0-9]+(-[a-z0-9]+)*)(/([a-z0-9]+(-[a-z0-9]+)*))*\.(md|jpg|png|jpeg|svg)$' || true)

                                                if [ -n "$invalid_kebab_case" ]; then
                                                  echo -e "${Red}The following filenames are not in kebab-case:${Reset}"
                                                  x=1
                                                  echo "$invalid_kebab_case" | while read -r file; do
                                                    echo -e "${Red}$x. $file${Reset}"
                                                    x=$((x + 1))
                                                  done
                                                  failure_flag=1
                                                else
                                                  echo -e "${Green}All filenames are in kebab-case.${Reset}"
                                                fi

                                                # Length validation
                                                changed_files_for_length_check=$(echo "$changed_files" | xargs -n1 basename)
                                                long_files=$(echo "$changed_files_for_length_check" | awk 'length($0) > 100')

                                                if [ -n "$long_files" ]; then
                                                  echo -e "${Red}The following filenames exceed 100 characters:${Reset}"
                                                  x=1
                                                  echo "$long_files" | while read -r file; do
                                                    echo -e "${Red}$x. $file${Reset}"
                                                    x=$((x + 1))
                                                  done
                                                  failure_flag=1
                                                else
                                                  echo -e "${Green}All filenames are of valid length.${Reset}"
                                                fi

                                                if [ "$failure_flag" -eq 0 ]; then
                                                  echo -e "${Green}All validations passed.${Reset}"
                                                  exit 0
                                                else
                                                  echo -e "${Red}Validation failed.${Reset}"
                                                  exit 1
                                                fi
              - step:
                  type: Run
                  name: Build
                  identifier: Build
                  spec:
                    connectorRef: dockerhub_harness_jenkins
                    image: node:22
                    shell: Sh
                    command: |-
                      yarn
                      yarn build
                    privileged: true
                    envVariables:
                      SEGMENT_API_KEY: <+pipeline.variables.yarnBuildSegmentApiKey>
                      HARNESS_GENERIC_READ_ONLY_KEY: <+pipeline.variables.hdhYarnBuild>
                      HARNESS_GENERIC_ACCOUNT_IDENTIFIER: <+pipeline.variables.hdhPipelineAccountId>
                      COVEO_API_KEY: <+pipeline.variables.coveoApiKey>
                      GEMINI_API_KEY: <+pipeline.variables.GEMINI_API_KEY>
                      KAPA_FME_WEBSITE_ID: <+pipeline.variables.KAPA_FME_WEBSITE_ID>
                      KAPA_API_KEY: <+pipeline.variables.KAPA_API_KEY>
                      KAPA_PROJECT_ID: <+pipeline.variables.KAPA_PROJECT_ID>
                      MIXPANEL_TOKEN: <+pipeline.variables.MIXPANEL_TOKEN>
              - step:
                  type: Run
                  name: PR-Sync-Create
                  identifier: PR_Sync_Create
                  spec:
                    shell: Sh
                    command: |-
                      set +e
                      OUTPUT=$(node scripts/ci-pr-sync-create.mjs)
                      echo "$OUTPUT"
                      PR_NUMBER=$(echo "$OUTPUT" | grep '^PR_NUMBER=' | cut -d'=' -f2)
                      export PR_NUMBER
                    envVariables:
                      commentorToken: <+pipeline.variables.harnessCodeCommentorToken>
                      GEMINI_API_KEY: <+pipeline.variables.GEMINI_API_KEY>
                      BRANCH: <+trigger.branch>
                    outputVariables:
                      - name: PR_NUMBER
                  when:
                    stageStatus: Success
                    condition: <+trigger.branch>!~"/^main$/"
              # Runs on every non-main push (first push with no PR yet, and every
              # subsequent push once a PR exists) — see HDH-1049. Creates the PR on
              # first push, refreshes title/summary on later pushes. Preview links
              # start as placeholders here; PR-Sync-Update-Preview below patches in
              # the real Netlify URL once it's known, gated to the PR-event runs
              # where Publish-Netlify-Preview actually executes.
              - step:
                  type: Plugin
                  name: Publish-Netifly-Preview
                  identifier: Publish_Netlify_Preview
                  spec:
                    connectorRef: dockerhub_harness_jenkins
                    image: rlachhman/netlify-drone-plugin
                    privileged: true
                    settings:
                      dir: ./build
                      site_id: <+pipeline.variables.netiflySiteId>
                      token: <+pipeline.variables.netiflyPubToken>
                      debug: "true"
                  when:
                    stageStatus: Success
                    condition: <+trigger.event>.equals("PR") && <+trigger.branch>!~"/^main$/"
              - step:
                  type: Run
                  name: PR-Sync-Update-Preview
                  identifier: PR_Sync_Update_Preview
                  spec:
                    shell: Sh
                    command: |-
                      node scripts/ci-pr-sync-preview.mjs
                    envVariables:
                      commentorToken: <+pipeline.variables.harnessCodeCommentorToken>
                      GEMINI_API_KEY: <+pipeline.variables.GEMINI_API_KEY>
                      BRANCH: <+trigger.branch>
                      PR_NUMBER: <+execution.steps.PR_Sync_Create.output.outputVariables.PR_NUMBER>
                      DRAFT_URL: <+execution.steps.Publish_Netlify_Preview.output.outputVariables.DRAFT_URL>
                  when:
                    stageStatus: Success
                    condition: <+trigger.event>.equals("PR") && <+trigger.branch>!~"/^main$/"
              - step:
                  type: Run
                  name: Commentor
                  identifier: Run_2
                  spec:
                    shell: Sh
                    command: |-
                      set +e

                      # codebase.prNumber doesn't always resolve on re-runs — seen it come
                      # back as the literal string "null", which previously produced a
                      # pullreq/null/comments URL and a hard 400. Validate before using it,
                      # and skip non-blocking rather than fail the stage over a comment.
                      if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ] || ! echo "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
                        echo "No valid PR number available (codebase.prNumber='$PR_NUMBER') — skipping Commentor."
                        exit 0
                      fi

                      echo "Posting PR comment with Netlify preview link"

                      RESPONSE=$(curl -s -X POST \
                      -H "Authorization: Bearer $commentorToken" \
                      -H "Content-Type: application/json" \
                      -d '{"text": "Please check the Execution Link of the Pipeline for the Website Draft URL. This is located in the Preview Step behind the Harness VPN and also is available in #hdh_alerts. E.g Website Draft URL: https://unique-id--harness-developer.netlify.app. Current Draft URL is: <+execution.steps.Publish_Netlify_Preview.output.outputVariables.DRAFT_URL>"}' \
                      "https://harness0.harness.io/gateway/code/api/v1/repos/l7B_kbSEQD2wjrM7PShm5w/PROD/Harness_Commons/developer-hub/+/pullreq/$PR_NUMBER/comments")

                      echo "Response: $RESPONSE"

                      COMMENT_ID=$(echo "$RESPONSE" | jq -r '.data.id // .id')

                      echo "Extracted COMMENT_ID: $COMMENT_ID"

                      if [ -z "$COMMENT_ID" ] || [ "$COMMENT_ID" = "null" ]; then
                        echo "❌ Failed to create comment — continuing, this is non-blocking"
                        exit 0
                      fi

                      curl -X PUT \
                       -H "Authorization: Bearer $commentorToken" \
                       -H "Content-Type: application/json" \
                       -d '{"status":"resolved"}' \
                       "https://harness0.harness.io/gateway/code/api/v1/repos/l7B_kbSEQD2wjrM7PShm5w/PROD/Harness_Commons/developer-hub/+/pullreq/$PR_NUMBER/comments/$COMMENT_ID/status"
                    envVariables:
                      commentorToken: <+pipeline.variables.harnessCodeCommentorToken>
                      PR_NUMBER: <+codebase.prNumber>
                  when:
                    stageStatus: Success
                    condition: <+trigger.event>.equals("PR") && <+trigger.branch>!~"/^main$/"
              # PRODUCTION PUBLISH — must only ever run for a push to main itself.
              # Gate on <+trigger.branch> (the branch that was actually pushed), NOT
              # <+trigger.targetBranch>. targetBranch is a pull-request concept and
              # resolves to "main" for any branch with an open PR against main, so the
              # old condition let a plain push to a feature branch publish that branch's
              # build straight to developer.harness.io, silently reverting merged docs
              # and exposing unreviewed content. See HDH-1124.
              - step:
                  type: Plugin
                  name: Publish-Netifly-Prod
                  identifier: PublishNetiflyProd
                  spec:
                    connectorRef: dockerhub_harness_jenkins
                    image: rlachhman/netlify-drone-plugin
                    privileged: true
                    settings:
                      dir: ./build
                      prod: "true"
                      site_id: <+pipeline.variables.netiflySiteId>
                      token: <+pipeline.variables.netiflyPubToken>
                      debug: "true"
                  when:
                    condition: <+trigger.event>.equals("PUSH") && <+trigger.branch>.equals("main")
                    stageStatus: Success
          caching:
            enabled: true
            key: "{{ checksum \"yarn.lock\" }}"
            paths:
              - node_modules
          buildIntelligence:
            enabled: false
  properties:
    ci:
      codebase:
        repoName: developer-hub
        build: <+input>
        sparseCheckout: []
        depth: 0
  variables:
    - name: netiflyPubToken
      type: Secret
      description: ""
      required: false
      value: netiflyPublishingToken
    - name: harnessCodeCommentorToken
      type: Secret
      description: ""
      required: false
      value: hdhCommenterToken
    - name: hdhYarnBuild
      type: Secret
      description: ""
      required: false
      value: hdhYarnBuildToken
    - name: coveoApiKey
      type: Secret
      description: ""
      required: false
      value: developerhubCoveoAccessToken
    - name: yarnBuildSegmentApiKey
      type: Secret
      description: ""
      required: false
      value: yarnBuildSegmentApiKey
    - name: hdhPipelineAccountId
      type: Secret
      description: ""
      required: false
      value: hdhPipelineAccountId
    - name: netiflySiteId
      type: Secret
      description: ""
      required: false
      value: netiflySiteId
    - name: GEMINI_API_KEY
      type: Secret
      description: Gemini API Key for dynamically generated AI content, e.g. Release Notes landing page.
      required: true
      value: hdhGeminiApiKey
    - name: KAPA_FME_WEBSITE_ID
      type: Secret
      description: Kapa website ID for the FME Release Agent iframe (customFields.KAPA_FME_WEBSITE_ID). Must be set for preview/prod builds; match the value you use locally (e.g. from .env). Also add Netlify preview host patterns in Kapa (allowed domains) or the widget can load blank.
      required: false
      value: hdhKapaFmeWebsiteId
    - name: KAPA_API_KEY
      type: Secret
      description: ""
      required: true
      value: kapaApiKey
    - name: KAPA_PROJECT_ID
      type: Secret
      description: ""
      required: true
      value: kapaProject
    - name: MIXPANEL_TOKEN
      type: Secret
      description: Mixpanel token to track HDH traffic and user docc activity
      required: false
      value: mixpanelToken
